<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot - AI Document Assistant</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h1>RAG Chatbot</h1>
                </div>
                <div class="status-indicator" id="status-indicator">
                    <i class="fas fa-circle"></i>
                    <span>Ready</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel - File Management -->
            <div class="left-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-file-upload"></i> Document Manager</h2>
                </div>
                
                <!-- Upload Section -->
                <div class="upload-section">
                    <div class="upload-area" id="upload-area">
                        <div class="upload-content">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drag & drop your PDF here</p>
                            <p class="upload-subtitle">or click to browse</p>
                        </div>
                        <input type="file" id="file-input" accept=".pdf" hidden>
                    </div>
                    <button class="upload-btn" id="upload-btn" disabled>
                        <i class="fas fa-upload"></i>
                        Process Document
                    </button>
                </div>

                <!-- File List -->
                <div class="file-list-section">
                    <h3><i class="fas fa-folder-open"></i> Uploaded Documents</h3>
                    <div class="file-list" id="file-list">
                        <div class="no-files">
                            <i class="fas fa-file-pdf"></i>
                            <p>No documents uploaded yet</p>
                        </div>
                    </div>
                </div>

                <!-- Processing Status -->
                <div class="processing-status" id="processing-status" style="display: none;">
                    <div class="spinner"></div>
                    <p>Processing document with GPU...</p>
                </div>
            </div>

            <!-- Right Panel - Chat Interface -->
            <div class="right-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-comments"></i> AI Assistant</h2>
                </div>
                
                <!-- Chat Messages -->
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <div class="welcome-message">
                            <div class="welcome-content">
                                <i class="fas fa-robot"></i>
                                <h3>Welcome to RAG Chatbot!</h3>
                                <p>Upload a PDF document to start asking questions about its content.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chat Input -->
                <div class="chat-input-container">
                    <form id="chat-form" class="chat-form">
                        <div class="input-group">
                            <input type="text" id="question-input" placeholder="Ask a question about your document..." autocomplete="off" disabled>
                            <button type="submit" id="send-btn" disabled>
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </form>
                    <div class="typing-indicator" id="typing-indicator" style="display: none;">
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span>AI is thinking...</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
</body>
</html>
